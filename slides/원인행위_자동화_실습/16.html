<div class="sk tone-amber">

  <style>
    /* 세로 여백이 남는 장 — 글씨를 더 키움 */
    .sk .step__title { font-size: 30px; }
    .sk .step__desc  { font-size: 23px; }
    .sk .step__body  { padding-bottom: 34px; }
    .sk .tbl--key th, .sk .tbl--key td { font-size: 23px; }
  </style>

  <div class="s-head">
    <div class="s-head__main">
      <span class="s-badge"><i class="fa-solid fa-power-off"></i> 실습</span>
      <h2 class="s-title">켤 때마다 자동으로 &mdash; shell:startup</h2>
    </div>
  </div>

  <div class="cols cols--left">

    <div class="col">
      <div class="steps">
        <div class="step">
          <div class="step__rail"><div class="step__num">1</div><div class="step__line"></div></div>
          <div class="step__body">
            <div class="step__title"><code>Win + R</code> → <code>shell:startup</code></div>
            <div class="step__desc">시작프로그램 폴더가 열립니다</div>
          </div>
        </div>
        <div class="step">
          <div class="step__rail"><div class="step__num">2</div><div class="step__line"></div></div>
          <div class="step__body">
            <div class="step__title">exe 우클릭 → [바로 가기 만들기]</div>
            <div class="step__desc">exe 본체는 그 자리에 둡니다</div>
          </div>
        </div>
        <div class="step">
          <div class="step__rail"><div class="step__num">3</div></div>
          <div class="step__body">
            <div class="step__title">바로 가기를 그 폴더로 옮기기</div>
            <div class="step__desc">재부팅하면 트레이에서 대기</div>
          </div>
        </div>
      </div>
    </div>

    <div class="col">
      <table class="tbl--key">
        <thead><tr><th>단축키</th><th>하는 일</th></tr></thead>
        <tbody>
          <tr><td><code>Ctrl+Alt+Win+F12</code></td><td>제어창 열기</td></tr>
          <tr class="highlight"><td><code>Ctrl+Alt+Win+F1~F9</code></td><td>시나리오 실행</td></tr>
          <tr><td><code>Ctrl+Alt+Win+F11</code></td><td>비상 중단</td></tr>
        </tbody>
      </table>
    </div>

  </div>

</div>
