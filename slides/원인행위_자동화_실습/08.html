<div class="sk tone-amber">

  <div class="s-head">
    <div class="s-head__main">
      <span class="s-badge"><i class="fa-solid fa-key"></i> 같이</span>
      <h2 class="s-title">Gemini API 키 발급</h2>
    </div>
  </div>

  <div class="cols cols--left">

    <div class="col">
      <div class="steps">
        <div class="step">
          <div class="step__rail"><div class="step__num">1</div><div class="step__line"></div></div>
          <div class="step__body">
            <div class="step__title">aistudio.google.com/apikey</div>
            <div class="step__desc">Google 계정으로 로그인</div>
          </div>
        </div>
        <div class="step">
          <div class="step__rail"><div class="step__num">2</div><div class="step__line"></div></div>
          <div class="step__body">
            <div class="step__title">[API 키 만들기]</div>
            <div class="step__desc">만들어진 키를 복사</div>
          </div>
        </div>
        <div class="step">
          <div class="step__rail"><div class="step__num">3</div><div class="step__line"></div></div>
          <div class="step__body">
            <div class="step__title">결제 계정 연결</div>
            <div class="step__desc">유료 키로 바뀝니다</div>
          </div>
        </div>
        <div class="step">
          <div class="step__rail"><div class="step__num">4</div></div>
          <div class="step__body">
            <div class="step__title">도우미 설정창에 붙여넣기</div>
            <div class="step__desc">'유료' 선택 → 저장</div>
          </div>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="card card--pick">
        <div class="card__title">💳 유료 키</div>
        <ul class="list">
          <li>한 건에 약 <strong>2~8원</strong> (Flash-Lite)</li>
          <li>보낸 내용을 학습에 쓰지 않음</li>
        </ul>
      </div>
      <div class="card card--plain tone-red">
        <div class="card__title">🆓 무료 키</div>
        <ul class="list">
          <li class="is-warn">붐비는 시간엔 <strong>거의 거절</strong></li>
          <li class="is-warn">보낸 내용이 학습에 쓰일 수 있음</li>
        </ul>
      </div>
    </div>

  </div>

</div>
