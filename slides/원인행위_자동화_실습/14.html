<div class="sk tone-amber">

  <div class="s-head">
    <div class="s-head__main">
      <span class="s-badge"><i class="fa-solid fa-gears"></i> 동작 원리</span>
      <h2 class="s-title">버튼 사진을 화면에서 찾아 누른다</h2>
    </div>
  </div>

  <div class="cols">

    <div class="flow flow--down">
      <div class="card card--row card--plain">
        <div class="card__icon"><i class="fa-solid fa-file-excel"></i></div>
        <div>
          <div class="card__title">Tasks.xlsx = 순서표</div>
          <p class="card__body">무엇을, 어떤 순서로</p>
        </div>
      </div>
      <i class="fa-solid fa-plus flow__arrow"></i>
      <div class="card card--row card--plain">
        <div class="card__icon"><i class="fa-solid fa-image"></i></div>
        <div>
          <div class="card__title">자동화이미지 = 버튼 사진</div>
          <p class="card__body">어디를 누를지</p>
        </div>
      </div>
      <i class="fa-solid fa-arrow-down flow__arrow"></i>
      <div class="card card--row card--fill">
        <div class="card__icon"><i class="fa-solid fa-crosshairs"></i></div>
        <div>
          <div class="card__title">화면에서 같은 그림을 찾아 클릭</div>
          <p class="card__body">못 찾으면 기다렸다 다시</p>
        </div>
      </div>
    </div>

    <div class="col">
      <table class="tbl--key">
        <thead>
          <tr><th style="width:12%;">#</th><th style="width:34%;">동작</th><th>대상</th></tr>
        </thead>
        <tbody>
          <tr><td>1</td><td>키워드클릭</td><td>결재경로지정</td></tr>
          <tr><td>2</td><td>사용자입력</td><td>결재자 이름 묻기</td></tr>
          <tr class="highlight"><td>3</td><td>입력</td><td><code>{{결재자}}</code></td></tr>
          <tr><td>4</td><td>키입력</td><td>enter</td></tr>
          <tr><td>5</td><td>키워드클릭</td><td>결재올림버튼</td></tr>
        </tbody>
      </table>
      <p class="tag">Tasks.xlsx 한 줄 = 한 동작</p>
    </div>

  </div>

</div>
