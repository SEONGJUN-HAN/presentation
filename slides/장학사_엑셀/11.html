<h2 class="slide-title">구분 연습 — 해설</h2>
<div class="content-area">
  <ul>
    <li><strong>예시 ①</strong> = 보고서형 — 머리글 <strong>1·2·3학년이 '값'</strong>입니다. 학년이 가로로 펼쳐졌죠.</li>
    <li><strong>예시 ②</strong> = 데이터형 — 머리글이 모두 <strong>'항목 이름'</strong>이고, 한 줄이 한 건입니다.</li>
  </ul>
  <div class="info-box"><p>둘은 <strong>같은 정보를 다른 모양</strong>으로 담은 것. ①→②로 푸는 게 <strong>언피벗</strong>, ②만 있으면 피벗으로 ①을 <strong>언제든</strong> 다시 만듭니다.</p></div>
</div>
