<h2 class="slide-title" data-important="true">
  구분하는 법 — 머리글을 보세요 <span class="badge"><i class="fa-solid fa-star"></i> 중요</span>
</h2>
<div class="content-area">
  <div class="info-box"><p>열 <strong>머리글</strong>이 무엇인지만 보면 바로 갈립니다.</p></div>
  <ul>
    <li>머리글이 <strong>'항목 이름'</strong>(학교·학년·인원·날짜)이면 → <strong>데이터형</strong></li>
    <li>머리글이 <strong>'값 그 자체'</strong>(1학년·2학년, 1월·2월)면 → <strong>보고서형(피벗됨)</strong></li>
    <li>한 행이 <strong>완결된 한 건의 기록</strong>이면 → 데이터형</li>
  </ul>
  <div class="key-box">머리글에 <strong>학년·날짜·연도·이름이 줄줄이</strong> 있으면 → 십중팔구 <strong>피벗된 자료</strong></div>
</div>
