<div class="sk tone-red">

  <div class="s-head">
    <div class="s-head__main">
      <span class="s-badge">예를 들어</span>
      <h2 class="s-title">이 데이터, 어디서 구하죠?</h2>
    </div>
  </div>

  <div class="s-sub">
    필요한 자료 — <strong>연도별 다문화 학생 졸업 후 취업 현황</strong>
  </div>

  <div class="cols">

    <div class="col">
      <img class="shot" src="img/교데통/06_search.png" alt="서류함 미로 앞에서 돋보기를 든 사람">
    </div>

    <div class="col" style="gap:var(--sp-3); --fs-lead:25px; --fs-sm:19px;">

      <div class="card card--row card--plain">
        <div class="card__icon"><i class="fa-solid fa-magnifying-glass"></i></div>
        <div>
          <div class="card__title">① 있긴 한가?</div>
          <div class="card__body">조직 안에 있는지조차 알 수 없습니다.</div>
        </div>
      </div>

      <div class="card card--row card--plain">
        <div class="card__icon"><i class="fa-solid fa-phone"></i></div>
        <div>
          <div class="card__title">② 받을 수 있나?</div>
          <div class="card__body">관련 부서에 물어봐도 장담 못 합니다.</div>
        </div>
      </div>

      <div class="card card--row card--plain">
        <div class="card__icon"><i class="fa-solid fa-user-clock"></i></div>
        <div>
          <div class="card__title">③ 아는 사람이 있나?</div>
          <div class="card__body">담당자가 자주 바뀌어 존재를 모를 수도 있습니다.</div>
        </div>
      </div>

      <div class="card card--row card--plain">
        <div class="card__icon"><i class="fa-solid fa-table-cells"></i></div>
        <div>
          <div class="card__title">④ 받아도 쓸 수 있나?</div>
          <div class="card__body">연도별로 정리돼 있지 않을 수 있습니다.</div>
        </div>
      </div>

    </div>

  </div>

</div>
