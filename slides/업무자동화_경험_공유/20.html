<div class="sk tone-cyan">

  <div class="s-head">
    <div class="s-head__main">
      <h2 class="s-title" data-important="true">비개발자인 내가 이걸 다 만든 이유</h2>
    </div>
  </div>

  <div class="cols">

    <!-- 왼쪽: LLM 역할 -->
    <div class="col">

      <div class="card center" style="border-radius:var(--r-xl);">
        <div style="font-size:52px;">🤖</div>
        <div style="font-size:var(--fs-h3); font-weight:800; color:#fff;">LLM</div>
        <div class="dim" style="font-size:var(--fs-sm);">ChatGPT · Claude · 등</div>
        <div style="background:var(--tone-bg-2); border-radius:var(--r-sm); padding:10px 14px;">
          <div class="hl" style="font-size:var(--fs-body); font-weight:600;">"24시간 대기 중인 수석 개발자"</div>
        </div>
      </div>

      <!-- 원본 642×246 ≈ 2.61:1 -->
      <div style="aspect-ratio:642/246; border-radius:var(--r-md); overflow:hidden;">
        <img src="img/코드이미지.png" alt="LLM 채팅으로 코드 받는 실제 화면"
             style="width:100%; height:100%; object-fit:contain; display:block;" />
      </div>

    </div>

    <!-- 오른쪽: LLM 활용법 -->
    <div class="col">

      <div class="card card--plain row" style="flex-direction:row; gap:var(--sp-3); align-items:flex-start;">
        <div class="card__icon" style="width:40px; height:40px; font-size:var(--fs-body);">
          <i class="fa-solid fa-pen-nib"></i>
        </div>
        <div>
          <div style="font-size:var(--fs-body); color:#fff; font-weight:700;">말로 설명하면 코드를 짜준다</div>
          <div class="dim" style="font-size:var(--fs-sm); margin-top:3px;">"사업자번호 엑셀에서 읽어서 API 호출하는 코드 짜줘"</div>
        </div>
      </div>

      <div class="card card--plain tone-lime row" style="flex-direction:row; gap:var(--sp-3); align-items:flex-start;">
        <div class="card__icon" style="width:40px; height:40px; font-size:var(--fs-body);">
          <i class="fa-solid fa-bug"></i>
        </div>
        <div>
          <div style="font-size:var(--fs-body); color:#fff; font-weight:700;">에러 메시지를 붙여넣으면 고쳐준다</div>
          <div class="dim" style="font-size:var(--fs-sm); margin-top:3px;">에러 복사 → 붙여넣기 → 수정된 코드 수령</div>
        </div>
      </div>

      <div class="card card--plain tone-amber row" style="flex-direction:row; gap:var(--sp-3); align-items:flex-start;">
        <div class="card__icon" style="width:40px; height:40px; font-size:var(--fs-body);">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <div>
          <div style="font-size:var(--fs-body); color:#fff; font-weight:700;">모르는 부분은 설명까지 해준다</div>
          <div class="dim" style="font-size:var(--fs-sm); margin-top:3px;">코드 이해 → 수정 → 내 것으로 만들기</div>
        </div>
      </div>

      <div class="note" style="font-size:var(--fs-body);">
        ⚡ <strong class="hl">두려움을 버리세요.</strong><br>
        <span style="color:#fff; font-weight:400; font-size:var(--fs-sm);">코딩을 몰라도, LLM이 있으면 누구나 자동화를 만들 수 있는 시대입니다.</span>
      </div>

    </div>
  </div>
</div>
