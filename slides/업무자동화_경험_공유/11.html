<div class="sk tone-red">

  <div class="s-head">
    <div class="s-head__main">
      <span class="s-badge">⚠️ 경고</span>
      <h2 class="s-title" data-important="true">어설픈 자동화가 주는 덫</h2>
    </div>
  </div>

  <div class="cols">

    <!-- 왼쪽: 나쁜 자동화 -->
    <div class="card card--pick tone-red" style="border-radius:var(--r-xl); padding:var(--sp-5);">
      <div style="font-size:var(--fs-body); font-weight:700; color:var(--tone);">❌ 어설픈 자동화</div>
      <div style="aspect-ratio:16/9; border-radius:var(--r-md); overflow:hidden;">
        <img src="img/불안한 표정으로 모니터 감시하는 이미지.png"
             style="width:100%; height:100%; object-fit:contain; display:block;" />
      </div>
      <ul class="list">
        <li class="is-no">자동화를 돌려놓고 모니터를 계속 감시</li>
        <li class="is-no">'컴퓨터 감시 업무'가 하나 더 추가된 것</li>
        <li class="is-no">오히려 스트레스와 업무량 증가</li>
      </ul>
    </div>

    <!-- 오른쪽: 완성된 자동화 -->
    <div class="card card--pick tone-cyan" style="border-radius:var(--r-xl); padding:var(--sp-5);">
      <div style="font-size:var(--fs-body); font-weight:700; color:var(--tone);">✅ 완성도 100% 자동화</div>
      <div style="aspect-ratio:16/9; border-radius:var(--r-md); overflow:hidden;">
        <img src="img/여유롭게 자리를 떠나는 해방된 직장인 이미지.png"
             style="width:100%; height:100%; object-fit:contain; display:block;" />
      </div>
      <ul class="list">
        <li>내 손을 완전히 떠나 스스로 처리</li>
        <li>에러 없이 신뢰할 수 있다</li>
        <li>진정한 업무 해방이 찾아온다</li>
      </ul>
    </div>

  </div>
</div>
