<div class="sk tone-cyan">

  <div class="s-head">
    <div class="s-head__main">
      <span class="s-badge">🎯 Hook</span>
      <h2 class="s-title">이 클릭들… 제가 한 게 아닙니다</h2>
    </div>
  </div>

  <div class="cols">

    <!-- 왼쪽: 유튜브 영상 -->
    <div class="col">
      <div style="border-radius:var(--r-lg); overflow:hidden; flex:1; min-height:320px;">
        <iframe
          src="https://www.youtube.com/embed/i5tjYF2Bn0k"
          style="width:100%; height:100%; min-height:320px; border:none; display:block;"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </div>

    <!-- 오른쪽: 메시지 -->
    <div class="col">

      <div class="note">
        <div style="font-size:32px; margin-bottom:6px;">🖱️</div>
        <div style="font-size:var(--fs-lead); color:#fff; line-height:var(--lh-body);">
          "방금 보신 건 <strong class="hl">제가 한 게 아닙니다.</strong>"
        </div>
        <div class="dim" style="font-size:var(--fs-sm); margin-top:6px;">
          단축키 하나로 시작해, 간단한 입력만 하면<br>수십 번의 클릭을 컴퓨터가 알아서 끝냅니다.
        </div>
      </div>

      <!-- 3개 프로세스 -->
      <div class="stack">

        <div class="card card--plain row" style="padding:var(--sp-2) var(--sp-4); gap:var(--sp-3); flex-direction:row;">
          <div class="hl" style="background:var(--tone-bg-2); border:1px solid var(--tone-border); border-radius:var(--r-sm);
                                 padding:5px 10px; font-size:var(--fs-xs); font-weight:700; font-family:var(--font-mono); flex-shrink:0;">단축키</div>
          <span style="font-size:var(--fs-lead);">📄</span>
          <div style="flex:1; font-size:var(--fs-sm); color:#fff; font-weight:600;">공문 접수</div>
          <span class="dim" style="background:var(--surface); border-radius:var(--r-sm); padding:3px 8px; font-size:var(--fs-micro);">담당자</span>
          <i class="fa-solid fa-arrow-right dim" style="font-size:var(--fs-xs);"></i>
          <span class="hl" style="font-size:var(--fs-micro);">자동 처리 ⚡</span>
        </div>

        <div class="card card--plain row" style="padding:var(--sp-2) var(--sp-4); gap:var(--sp-3); flex-direction:row;">
          <div class="hl" style="background:var(--tone-bg-2); border:1px solid var(--tone-border); border-radius:var(--r-sm);
                                 padding:5px 10px; font-size:var(--fs-xs); font-weight:700; font-family:var(--font-mono); flex-shrink:0;">단축키</div>
          <span style="font-size:var(--fs-lead);">💳</span>
          <div style="flex:1; font-size:var(--fs-sm); color:#fff; font-weight:600;">법인카드 사용자 등록</div>
          <span class="dim" style="background:var(--surface); border-radius:var(--r-sm); padding:3px 8px; font-size:var(--fs-micro);">사용자</span>
          <span class="dim" style="background:var(--surface); border-radius:var(--r-sm); padding:3px 8px; font-size:var(--fs-micro);">카드</span>
          <i class="fa-solid fa-arrow-right dim" style="font-size:var(--fs-xs);"></i>
          <span class="hl" style="font-size:var(--fs-micro);">자동 처리 ⚡</span>
        </div>

        <div class="card card--plain row" style="padding:var(--sp-2) var(--sp-4); gap:var(--sp-3); flex-direction:row;">
          <div class="hl" style="background:var(--tone-bg-2); border:1px solid var(--tone-border); border-radius:var(--r-sm);
                                 padding:5px 10px; font-size:var(--fs-xs); font-weight:700; font-family:var(--font-mono); flex-shrink:0;">단축키</div>
          <span style="font-size:var(--fs-lead);">✍️</span>
          <div style="flex:1; font-size:var(--fs-sm); color:#fff; font-weight:600;">결재 요청</div>
          <span class="dim" style="background:var(--surface); border-radius:var(--r-sm); padding:3px 8px; font-size:var(--fs-micro);">결재자</span>
          <i class="fa-solid fa-arrow-right dim" style="font-size:var(--fs-xs);"></i>
          <span class="hl" style="font-size:var(--fs-micro);">자동 처리 ⚡</span>
        </div>

      </div>

      <!-- 핵심 메시지 -->
      <div class="ba">
        <div class="card card--plain center" style="flex:1; padding:var(--sp-3);">
          <div style="font-size:22px;">🔁</div>
          <div class="dim" style="font-size:var(--fs-xs); margin-top:6px;">수회~수십 번<br>반복 클릭</div>
        </div>
        <i class="fa-solid fa-arrow-right ba__arrow hl" style="font-size:22px;"></i>
        <div class="card center" style="flex:1; padding:var(--sp-3);">
          <div style="font-size:22px;">⚡</div>
          <div class="hl" style="font-size:var(--fs-xs); margin-top:6px; font-weight:600;">10~20초씩<br>매번 절약</div>
        </div>
      </div>

    </div>
  </div>
</div>
