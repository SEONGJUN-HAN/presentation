<div class="sk tone-amber">

  <div class="s-head">
    <div class="s-head__main">
      <span class="s-badge">③ 중급 완성도</span>
      <h2 class="s-title">이미지 기반 자동화</h2>
    </div>
  </div>

  <div class="cols">

    <!-- 왼쪽 -->
    <div class="col">

      <div class="card card--plain center" style="gap:var(--sp-3);">
        <div class="dim" style="font-size:var(--fs-xs);">작동 원리</div>
        <div class="row" style="justify-content:center; gap:var(--sp-3);">
          <div class="center" style="background:var(--tone-bg-2); border:1px dashed var(--tone-border);
                                     border-radius:var(--r-sm); padding:10px 16px;">
            <div class="dim" style="font-size:var(--fs-micro);">등록한 이미지</div>
            <i class="fa-solid fa-image hl" style="font-size:24px; margin-top:4px;"></i>
          </div>
          <div class="hl" style="font-size:22px;">👁️</div>
          <div class="center" style="background:var(--tone-bg-2); border:1px dashed var(--tone-border);
                                     border-radius:var(--r-sm); padding:10px 16px;">
            <div class="dim" style="font-size:var(--fs-micro);">화면에서 발견</div>
            <i class="fa-solid fa-magnifying-glass hl" style="font-size:24px; margin-top:4px;"></i>
          </div>
          <div class="hl" style="font-size:22px;">→</div>
          <div class="center" style="background:var(--tone-bg-2); border:1px dashed var(--tone-border);
                                     border-radius:var(--r-sm); padding:10px 16px;">
            <div class="dim" style="font-size:var(--fs-micro);">자동 클릭!</div>
            <i class="fa-solid fa-computer-mouse hl" style="font-size:24px; margin-top:4px;"></i>
          </div>
        </div>
      </div>

      <ul class="list">
        <li>개발자가 아니어도 직관적으로 설정</li>
        <li>웹 · 데스크탑 앱 모두 적용 가능</li>
        <li class="is-warn">해상도·테마 변경 시 인식 실패 가능</li>
      </ul>

      <div class="note">
        💡 <strong>추천 언어:</strong> AutoHotkey
      </div>

    </div>

    <!-- 오른쪽 -->
    <div class="col">
      <div class="dim" style="font-size:var(--fs-xs); font-weight:600; letter-spacing:.06em;">💼 실전 사례</div>

      <div class="card">
        <div class="row" style="align-items:flex-start; gap:var(--sp-3);">
          <span style="font-size:24px;">🖱️</span>
          <div>
            <div style="font-size:var(--fs-body); color:#fff; font-weight:700;">
              원인행위, 문서접수, 결재 요청 등 복잡한 UI 클릭 자동화
            </div>
            <div class="dim" style="font-size:var(--fs-sm); margin-top:4px; line-height:var(--lh-body);">
              매일 반복되는 복잡한 버튼 순서 클릭을<br>이미지 인식으로 완전 자동 처리
            </div>
          </div>
        </div>

        <div style="position:relative; width:100%; padding-bottom:56.25%; height:0; overflow:hidden; border-radius:var(--r-sm);">
          <iframe
            style="position:absolute; top:0; left:0; width:100%; height:100%;"
            src="https://www.youtube.com/embed/nJSe5m9mYIM?si=IVtbKty3w2EOa0Zg"
            title="이미지 기반 자동화 시연 영상"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
          </iframe>
        </div>
      </div>

    </div>

  </div>
</div>
