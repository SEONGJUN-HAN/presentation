<div class="sk tone-cyan">

  <div class="s-head">
    <div class="s-head__main">
      <h2 class="s-title" data-important="true">업무자동화란? &nbsp;컴퓨터에게 일을 시키는 것</h2>
    </div>
  </div>

  <div class="cols">

    <!-- 왼쪽: 이미지 -->
    <div class="col">
      <!-- 원본 1536×1024 = 3:2. 컨테이너 비율을 맞춰 잘리지 않게 함 -->
      <div style="border-radius:var(--r-lg); overflow:hidden; aspect-ratio:3/2;">
        <img src="img/로봇사무업무.png" style="width:100%; height:100%; object-fit:contain; display:block;" />
      </div>
    </div>

    <!-- 오른쪽: 핵심 메시지 -->
    <div class="col" style="gap:var(--sp-5);">

      <div class="stack" style="gap:var(--sp-3);">

        <div class="row tone-red" style="gap:var(--sp-4);">
          <div class="card__icon" style="width:52px; height:52px; border:1px solid var(--tone-border);">
            <i class="fa-solid fa-person" style="font-size:22px;"></i>
          </div>
          <div>
            <div style="font-size:var(--fs-body); color:#fff; font-weight:700;">사람이 잘하는 일</div>
            <div class="dim" style="font-size:var(--fs-sm); margin-top:2px;">판단 · 창의 · 소통 · 기획</div>
          </div>
        </div>

        <div class="row tone-cyan" style="gap:var(--sp-4);">
          <div class="card__icon" style="width:52px; height:52px; border:1px solid var(--tone-border);">
            <i class="fa-solid fa-computer" style="font-size:22px;"></i>
          </div>
          <div>
            <div style="font-size:var(--fs-body); color:#fff; font-weight:700;">컴퓨터가 잘하는 일</div>
            <div class="dim" style="font-size:var(--fs-sm); margin-top:2px;">반복 · 정확 · 빠름 · 지치지 않음</div>
          </div>
        </div>

      </div>

      <div style="height:1px; background:var(--surface-line);"></div>

      <div class="card center">
        <div style="font-size:var(--fs-body); color:#fff; line-height:2;">
          반복적인 일은 <strong class="hl">컴퓨터에게</strong> 맡기고<br>
          사람은 <strong class="tone-lime hl">사람만이 할 수 있는 일</strong>에 집중하자
        </div>
      </div>

    </div>
  </div>
</div>
