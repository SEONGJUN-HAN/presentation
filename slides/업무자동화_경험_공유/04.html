<div style="height:100%; display:flex; flex-direction:column; padding:48px 56px; box-sizing:border-box; gap:28px;">

  <h2 class="slide-title" data-important="true">업무자동화란?  <span style="color:var(--accent);">&nbsp;컴퓨터에게 일을 시키는 것</span></h2>

  <div class="two-column" style="flex:1; gap:40px; align-items:center;">

    <!-- 왼쪽: 이미지 -->
    <div class="image-wrapper" style="flex:1; height:100%; min-height:320px; border-radius:16px; overflow:hidden;">
      <img src="img/로봇사무업무.png"
           style="width:100%; height:100%; object-fit:cover; display:block;" />
    </div>

    <!-- 오른쪽: 핵심 메시지 -->
    <div style="display:flex; flex-direction:column; justify-content:center; gap:24px;">

      <!-- 핵심 정의 -->
      <div style="display:flex; flex-direction:column; gap:14px;">

        <div style="display:flex; align-items:center; gap:16px;">
          <div style="width:52px; height:52px; border-radius:14px; background:rgba(239,68,68,0.12); border:1px solid rgba(239,68,68,0.25); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            <i class="fa-solid fa-person" style="font-size:22px; color:rgba(239,68,68,0.8);"></i>
          </div>
          <div>
            <div style="font-size:15px; color:#fff; font-weight:700;">사람이 잘하는 일</div>
            <div style="font-size:13px; color:var(--text-dim); margin-top:2px;">판단 · 창의 · 소통 · 기획</div>
          </div>
        </div>

        <div style="display:flex; align-items:center; gap:16px;">
          <div style="width:52px; height:52px; border-radius:14px; background:rgba(0,255,200,0.12); border:1px solid rgba(0,255,200,0.25); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
            <i class="fa-solid fa-computer" style="font-size:22px; color:var(--accent);"></i>
          </div>
          <div>
            <div style="font-size:15px; color:#fff; font-weight:700;">컴퓨터가 잘하는 일</div>
            <div style="font-size:13px; color:var(--text-dim); margin-top:2px;">반복 · 정확 · 빠름 · 지치지 않음</div>
          </div>
        </div>

      </div>

      <!-- 구분선 -->
      <div style="height:1px; background:rgba(255,255,255,0.07);"></div>

      <!-- 결론 메시지 -->
      <div style="background:rgba(0,255,200,0.06); border:1px solid rgba(0,255,200,0.2); border-radius:14px; padding:20px 22px;">
        <p style="margin:0; font-size:16px; color:#fff; line-height:1.8; text-align:center;">
          반복적인 일은 <strong style="color:var(--accent);">컴퓨터에게</strong> 맡기고<br>
          사람은 <strong style="color:var(--accent-alt);">사람만이 할 수 있는 일</strong>에 집중하자
        </p>
      </div>

    </div>
  </div>
</div>
