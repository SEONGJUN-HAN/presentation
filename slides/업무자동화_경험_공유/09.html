<div class="sk tone-cyan">

  <div class="s-head">
    <div class="s-head__main">
      <h2 class="s-title" data-important="true">신뢰도가 곧 완성도다</h2>
    </div>
  </div>

  <div class="col grow" style="gap:var(--sp-5);">

    <!-- 신뢰도 게이지 바 -->
    <div class="stack" style="gap:var(--sp-4);">

      <div class="row tone-cyan" style="gap:var(--sp-4);">
        <span class="dim" style="font-size:var(--fs-sm); width:120px; text-align:right; flex-shrink:0;">API 활용</span>
        <div style="flex:1; height:30px; background:var(--surface); border-radius:var(--r-sm); overflow:hidden;">
          <div style="width:98%; height:100%; background:linear-gradient(90deg, var(--tone), var(--tone-bg-2));
                      border-radius:var(--r-sm); display:flex; align-items:center; padding-left:12px;">
            <span style="font-size:var(--fs-xs); color:#0a0f1e; font-weight:700;">최상급 👑가장 안정적</span>
          </div>
        </div>
        <span class="hl" style="font-size:var(--fs-sm); width:44px;">98%</span>
      </div>

      <div class="row tone-lime" style="gap:var(--sp-4);">
        <span class="dim" style="font-size:var(--fs-sm); width:120px; text-align:right; flex-shrink:0;">브라우저 조작</span>
        <div style="flex:1; height:30px; background:var(--surface); border-radius:var(--r-sm); overflow:hidden;">
          <div style="width:78%; height:100%; background:linear-gradient(90deg, var(--tone), var(--tone-bg-2));
                      border-radius:var(--r-sm); display:flex; align-items:center; padding-left:12px;">
            <span style="font-size:var(--fs-xs); color:#1a1a1a; font-weight:700;">상급 🌐유연</span>
          </div>
        </div>
        <span class="hl" style="font-size:var(--fs-sm); width:44px;">78%</span>
      </div>

      <div class="row tone-amber" style="gap:var(--sp-4);">
        <span class="dim" style="font-size:var(--fs-sm); width:120px; text-align:right; flex-shrink:0;">이미지 기반</span>
        <div style="flex:1; height:30px; background:var(--surface); border-radius:var(--r-sm); overflow:hidden;">
          <div style="width:58%; height:100%; background:linear-gradient(90deg, var(--tone), var(--tone-bg-2));
                      border-radius:var(--r-sm); display:flex; align-items:center; padding-left:12px;">
            <span style="font-size:var(--fs-xs); color:#1a1a1a; font-weight:700;">중급 🖼️직관적</span>
          </div>
        </div>
        <span class="hl" style="font-size:var(--fs-sm); width:44px;">58%</span>
      </div>

      <div class="row tone-red" style="gap:var(--sp-4);">
        <span class="dim" style="font-size:var(--fs-sm); width:120px; text-align:right; flex-shrink:0;">절대좌표 기반</span>
        <div style="flex:1; height:30px; background:var(--surface); border-radius:var(--r-sm); overflow:hidden;">
          <div style="width:30%; height:100%; background:linear-gradient(90deg, var(--tone), var(--tone-bg-2));
                      border-radius:var(--r-sm); display:flex; align-items:center; padding-left:12px;">
            <span style="font-size:var(--fs-xs); color:#fff; font-weight:700;">낮음 ⚡빠름</span>
          </div>
        </div>
        <span class="hl" style="font-size:var(--fs-sm); width:44px;">30%</span>
      </div>

    </div>

    <div class="note" style="font-size:var(--fs-body); color:#fff;">
      🔑 <strong class="hl">상황에 맞는 올바른 도구 선택</strong>이 완성도를 결정합니다.<br>
      <span class="dim" style="font-size:var(--fs-sm);">곧 소개할 4가지 무기 — 각각의 적합한 상황을 파악하는 것이 핵심!</span>
    </div>

  </div>
</div>
