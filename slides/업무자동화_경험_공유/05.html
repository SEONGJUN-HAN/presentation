<div style="height:100%; display:flex; flex-direction:column; padding:48px 56px; box-sizing:border-box; gap:28px;">

    <h2 class="slide-title">업무자동화, 딱 두 가지만 기억하세요</h2>
  
    <div class="two-column" style="flex:1; gap:28px;">
  
      <!-- 단순성 카드 -->
      <div style="background:rgba(0,255,200,0.05); border:1px solid rgba(0,255,200,0.2); border-radius:20px; padding:36px 32px; display:flex; flex-direction:column; gap:20px;">
        <div style="display:flex; align-items:center; gap:14px;">
          <div style="width:52px;height:52px;border-radius:14px;background:rgba(0,255,200,0.15);display:flex;align-items:center;justify-content:center;">
            <i class="fa-solid fa-code-branch" style="font-size:24px; color:var(--accent);"></i>
          </div>
          <div>
            <div style="font-size:12px; color:var(--text-dim); letter-spacing:0.1em; text-transform:uppercase;">조건 01</div>
            <div style="font-size:22px; font-weight:800; color:#fff;">단순성</div>
          </div>
        </div>
  
        <div style="background:rgba(0,0,0,0.3); border-radius:12px; padding:18px 20px; font-family:monospace; font-size:20px; color:var(--accent); text-align:center; line-height:1.8;">
          <span style="color:var(--accent-alt);">A</span> 이면<br>
          <span style="color:var(--accent-alt);">B</span> 이다
        </div>
  
        <div style="background:rgba(255,255,255,0.04); border-radius:10px; padding:14px 16px;">
          <div style="font-size:13px; color:var(--text-dim); margin-bottom:4px;">예시</div>
          <div style="font-size:15px; color:#fff; line-height:1.6;">📧 메일이 오면<br>→ 첨부파일을 자동 다운로드</div>
        </div>
      </div>
  
      <!-- 반복성 카드 -->
      <div style="background:rgba(163,230,53,0.04); border:1px solid rgba(163,230,53,0.2); border-radius:20px; padding:36px 32px; display:flex; flex-direction:column; gap:20px;">
        <div style="display:flex; align-items:center; gap:14px;">
          <div style="width:52px;height:52px;border-radius:14px;background:rgba(163,230,53,0.12);display:flex;align-items:center;justify-content:center;">
            <i class="fa-solid fa-rotate" style="font-size:24px; color:var(--accent-alt);"></i>
          </div>
          <div>
            <div style="font-size:12px; color:var(--text-dim); letter-spacing:0.1em; text-transform:uppercase;">조건 02</div>
            <div style="font-size:22px; font-weight:800; color:#fff;">반복성</div>
          </div>
        </div>
  
        <!-- 타임라인 비교 -->
        <div style="display:flex; flex-direction:column; gap:12px;">
          <div style="display:flex; align-items:center; gap:12px;">
            <span style="font-size:13px; color:var(--text-dim); width:90px; flex-shrink:0;">한 번만 할 일</span>
            <div style="flex:1; height:8px; border-radius:4px; background:rgba(255,255,255,0.08); position:relative; overflow:hidden;">
              <div style="width:10%; height:100%; background:rgba(239,68,68,0.6); border-radius:4px;"></div>
            </div>
            <span style="font-size:12px; color:rgba(239,68,68,0.8); width:60px;">직접  ✅</span>
          </div>
          <div style="display:flex; align-items:center; gap:12px;">
            <span style="font-size:13px; color:var(--text-dim); width:90px; flex-shrink:0;">매일 반복</span>
            <div style="flex:1; height:8px; border-radius:4px; background:rgba(255,255,255,0.08); position:relative; overflow:hidden;">
              <div style="width:95%; height:100%; background:var(--accent-alt); border-radius:4px;"></div>
            </div>
            <span style="font-size:12px; color:var(--accent-alt); width:60px;">자동화!⚡</span>
          </div>
        </div>
  
        <div class="info-box" style="padding:14px 16px; background:rgba(163,230,53,0.08); border:none;">
          <p style="margin:0; font-size:14px; color:#fff; line-height:1.7;">
            ⏱️ 직접 하면 <strong style="color:var(--accent-alt);">10분</strong> ·
            자동화 구축 <strong style="color:rgba(239,68,68,0.9);">2시간</strong><br>
            → 매일 반복 시 <strong style="color:var(--accent);">수백 시간 이득</strong>
          </p>
        </div>
      </div>
  
    </div>
  </div>
