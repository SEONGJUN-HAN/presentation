<h2 class="slide-title" data-important="true">
    업무자동화 = 내 업무용 함수 만들기
    <span class="badge"><i class="fa-solid fa-calculator"></i> 오늘의 개념</span>
</h2>

<div class="content-area">
    <p style="font-size: 19px; margin-bottom: 14px;">
        엑셀의 <code>=SUM()</code> 은 숫자가 바뀌어도 늘 같은 규칙으로 더합니다.<br>
        <strong style="color: var(--accent)">내 업무에도 이런 함수를 하나 만들어 두는 것</strong>, 그게 업무자동화입니다.
    </p>

    <div style="display: grid; grid-template-columns: 1fr 60px 1.1fr 60px 1fr; gap: 10px;
                flex-grow: 1; align-items: stretch;">

        <div style="background: var(--bg-secondary); border-radius: 12px; padding: 20px 22px;
                    border: 1px solid var(--border); border-top: 4px solid var(--border);
                    display: flex; flex-direction: column; justify-content: center;">
            <p style="font-size: 15px; color: var(--text-dim); margin: 0 0 6px 0;">넣는 것 · 매번 바뀜</p>
            <h3 style="font-size: 26px; margin: 0 0 14px 0;">📥 내용</h3>
            <p style="font-size: 20px; margin: 0; line-height: 1.7;">
                이번 달 직원 명단<br>
                이번 주 영수증<br>
                오늘 장바구니
            </p>
        </div>

        <div style="display: flex; align-items: center; justify-content: center;
                    font-size: 34px; color: var(--accent);">
            <i class="fa-solid fa-arrow-right"></i>
        </div>

        <div style="background: var(--accent); border-radius: 12px; padding: 20px 22px;
                    border: 1px solid var(--accent); color: var(--bg-primary);
                    display: flex; flex-direction: column; justify-content: center;">
            <p style="font-size: 15px; margin: 0 0 6px 0; color: var(--bg-primary); opacity: 0.8;">처리 · 안 바뀜</p>
            <h3 style="font-size: 26px; margin: 0 0 14px 0; color: var(--bg-primary);">⚙ 규칙 (코드)</h3>
            <p style="font-size: 20px; margin: 0; line-height: 1.7; color: var(--bg-primary);">
                한 번 만들어 두면<br>
                <strong style="color: var(--bg-primary);">다음부터는 코드가 알아서</strong>
            </p>
        </div>

        <div style="display: flex; align-items: center; justify-content: center;
                    font-size: 34px; color: var(--accent);">
            <i class="fa-solid fa-arrow-right"></i>
        </div>

        <div style="background: var(--bg-secondary); border-radius: 12px; padding: 20px 22px;
                    border: 1px solid var(--border); border-top: 4px solid var(--accent-alt);
                    display: flex; flex-direction: column; justify-content: center;">
            <p style="font-size: 15px; color: var(--accent-alt); margin: 0 0 6px 0;">나오는 것 · 늘 같은 모양</p>
            <h3 style="font-size: 26px; margin: 0 0 14px 0;">📤 결과</h3>
            <p style="font-size: 20px; margin: 0; line-height: 1.7;">
                개인별 PDF<br>
                에듀파인 표<br>
                엑셀 목록
            </p>
        </div>
    </div>

    <div class="info-box" style="margin-top: 16px;">
        <p><i class="fa-solid fa-lightbulb"></i>&nbsp;
            <strong style="color: var(--text-main)">구조가 바뀌지 않는 한</strong>, 내용이 바뀌어도 결과는 같은 모양으로 나옵니다.
        </p>
    </div>
</div>
