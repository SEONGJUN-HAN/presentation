<h2 class="slide-title" data-important="true">
    영수증 사진 → 엑셀 표, 30초
    <span class="badge"><i class="fa-solid fa-play"></i> 라이브 ①</span>
</h2>

<div class="content-area">
    <div class="ba-live" style="display: grid; grid-template-columns: 1fr 70px 1fr; gap: 12px;
                flex-grow: 1; align-items: stretch;">

        <div style="background: var(--bg-secondary); border-radius: 12px; padding: 24px 26px;
                    border: 1px solid var(--border); border-top: 4px solid var(--border);
                    display: flex; flex-direction: column;">
            <p style="font-size: 15px; color: var(--text-dim); margin: 0 0 6px 0;">지금까지</p>
            <h3 style="font-size: 24px; margin: 0 0 16px 0;">🧾 한 장씩 보며 옮겨 적기</h3>
            <ul style="list-style: none; padding: 0; margin: 0; font-size: 18px;
                       color: var(--text-dim); line-height: 2;">
                <li>· 품명과 수량을 찾아 치고</li>
                <li>· 금액을 한 줄씩 옮기고</li>
                <li>· 합계가 맞는지 계산기로 다시</li>
                <li>· 10장이면 <strong style="color: var(--text-main)">열 번 반복</strong></li>
            </ul>
        </div>

        <div style="display: flex; align-items: center; justify-content: center;
                    font-size: 40px; color: var(--accent);">
            <i class="fa-solid fa-arrow-right"></i>
        </div>

        <div style="background: var(--bg-secondary); border-radius: 12px; padding: 24px 26px;
                    border: 1px solid var(--border); border-top: 4px solid var(--accent);
                    display: flex; flex-direction: column;">
            <p style="font-size: 15px; color: var(--accent); margin: 0 0 6px 0;">지금부터</p>
            <h3 style="font-size: 24px; margin: 0 0 16px 0;">📸 사진만 올리기</h3>
            <ul style="list-style: none; padding: 0; margin: 0; font-size: 18px;
                       color: var(--text-dim); line-height: 2;">
                <li>· 영수증 여러 장을 <strong style="color: var(--text-main)">한 번에</strong> 올리면</li>
                <li>· 에듀파인 양식대로 <strong style="color: var(--text-main)">표 하나로</strong></li>
                <li>· 합계가 안 맞으면 <strong style="color: var(--text-main)">AI가 먼저 경고</strong></li>
                <li>· 엑셀에 <code>Ctrl + V</code> 끝</li>
            </ul>
        </div>
    </div>

    <div class="info-box" style="margin-top: 16px;">
        <p><i class="fa-solid fa-hand-point-right"></i>&nbsp;
            설치한 것 없습니다.<br> 쓴 것은 <strong style="color: var(--text-main)">제미나이 채팅창 하나</strong>.<br>
            <strong style="color: var(--accent)">20분 뒤에 여러분이 직접 만듭니다.</strong>
        </p>
    </div>
</div>
