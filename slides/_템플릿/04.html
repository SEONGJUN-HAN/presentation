<div class="sk tone-sky">

  <div class="s-head">
    <div class="s-head__main">
      <span class="s-badge">② 카드형</span>
      <h2 class="s-title">여러 항목을 나란히 비교</h2>
    </div>
  </div>

  <!-- tone 클래스를 카드마다 바꾸면 색이 따라 바뀝니다 -->
  <div class="cols cols--3">

    <div class="card tone-sky">
      <div class="card__head">
        <div class="card__icon"><i class="fa-solid fa-plug"></i></div>
        <div class="card__title">첫 번째</div>
      </div>
      <span class="tag">보조 설명</span>
      <div class="card__body">
        카드 본문입니다. 길이가 서로 달라도 아래 정렬이 맞습니다.
      </div>
      <div class="card__foot"><i class="fa-solid fa-bolt"></i><span>한 줄 요약</span></div>
    </div>

    <div class="card tone-amber">
      <div class="card__head">
        <div class="card__icon"><i class="fa-solid fa-image"></i></div>
        <div class="card__title">두 번째</div>
      </div>
      <span class="tag">보조 설명</span>
      <div class="card__body">
        <strong>tone-amber</strong> 를 붙이면 이 카드만 색이 바뀝니다.
      </div>
      <div class="card__foot"><i class="fa-solid fa-bolt"></i><span>한 줄 요약</span></div>
    </div>

    <!-- 추천 항목은 card--pick 으로 테두리 강조 -->
    <div class="card card--pick tone-lime">
      <div class="card__head">
        <div class="card__icon"><i class="fa-solid fa-star"></i></div>
        <div class="card__title">세 번째</div>
      </div>
      <span class="tag">보조 설명</span>
      <div class="card__body">
        가장 강조하고 싶은 카드에 <strong>card--pick</strong>.
      </div>
      <div class="card__foot"><i class="fa-solid fa-bolt"></i><span>한 줄 요약</span></div>
    </div>

  </div>

  <div class="note tone-lime">
    💡 <strong>공통점:</strong> 카드 아래에 마무리 문장을 둡니다.
  </div>

</div>
