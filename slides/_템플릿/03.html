<div class="sk tone-cyan">

  <!-- 머리말: 배지 + 제목 (+ 오른쪽 알약) -->
  <div class="s-head">
    <div class="s-head__main">
      <span class="s-badge">① 기본형</span>
      <h2 class="s-title">2단 구성 — 설명과 사례</h2>
    </div>
    <span class="s-pill">⏭️ 필요하면 스킵</span>
  </div>

  <div class="s-sub">
    제목 아래 한 줄 설명이 필요하면 <strong>s-sub</strong> 를 씁니다.
  </div>

  <div class="cols">

    <!-- 왼쪽: 개념 -->
    <div class="col">

      <div class="card card--plain">
        <div class="card__body center">
          그림·도식이 들어갈 자리입니다.
        </div>
      </div>

      <ul class="list">
        <li>체크 항목은 <strong>list</strong> 로 적습니다</li>
        <li>아이콘은 자동으로 붙습니다</li>
        <li class="is-warn">주의 항목은 <code>is-warn</code></li>
        <li class="is-no">안 되는 것은 <code>is-no</code></li>
      </ul>

      <div class="note">
        💡 <strong>핵심:</strong> 강조 문장은 note 로 감쌉니다.
      </div>

    </div>

    <!-- 오른쪽: 사례 -->
    <div class="col">

      <div class="dim" style="font-size:var(--fs-xs); font-weight:600; letter-spacing:.06em;">
        💼 실전 사례
      </div>

      <div class="card">
        <div class="card__head">
          <div class="card__icon"><i class="fa-solid fa-bolt"></i></div>
          <div class="grow">
            <div class="row row--between">
              <span class="card__title">사례 제목</span>
              <span class="tag">파일명 또는 출처</span>
            </div>
          </div>
        </div>
        <div class="card__body">
          무엇을 어떻게 자동화했는지 두어 줄로 설명합니다.
        </div>
        <div class="ba">
          <div class="ba__item ba__before">Before<b>수작업 30분</b></div>
          <i class="fa-solid fa-arrow-right ba__arrow"></i>
          <div class="ba__item ba__after">After<b>클릭 한 번</b></div>
        </div>
      </div>

    </div>

  </div>
</div>
