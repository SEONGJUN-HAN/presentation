<div class="sk tone-violet">

  <div class="s-head">
    <div class="s-head__main">
      <span class="s-badge">③ 단계형</span>
      <h2 class="s-title">순서를 보여줄 때</h2>
    </div>
  </div>

  <div class="cols cols--left">

    <!-- 왼쪽: 단계 타임라인 -->
    <div class="col">
      <div class="steps">

        <div class="step">
          <div class="step__rail"><div class="step__num">1</div><div class="step__line"></div></div>
          <div class="step__body">
            <div class="step__title">첫 단계</div>
            <div class="step__desc">무엇을 하는 단계인지 한두 줄로 적습니다.</div>
          </div>
        </div>

        <div class="step">
          <div class="step__rail"><div class="step__num">2</div><div class="step__line"></div></div>
          <div class="step__body">
            <div class="step__title">두 번째 단계</div>
            <div class="step__desc">연결선과 간격은 자동으로 잡힙니다.</div>
          </div>
        </div>

        <div class="step">
          <div class="step__rail"><div class="step__num">3</div><div class="step__line"></div></div>
          <div class="step__body">
            <div class="step__title">세 번째 단계</div>
            <div class="step__desc">단계를 늘리려면 step 블록을 복사하세요.</div>
          </div>
        </div>

        <div class="step">
          <div class="step__rail"><div class="step__num">4</div></div>
          <div class="step__body">
            <div class="step__title">마지막 단계</div>
            <div class="step__desc">마지막 단계의 연결선은 자동으로 사라집니다.</div>
          </div>
        </div>

      </div>
    </div>

    <!-- 오른쪽: 보조 설명 -->
    <div class="col">
      <div class="dim" style="font-size:var(--fs-xs); font-weight:600; letter-spacing:.06em;">
        🔍 함께 보여줄 기준
      </div>

      <div class="card">
        <div class="card__head">
          <div class="card__icon"><i class="fa-solid fa-code-branch"></i></div>
          <div class="card__title">조건 01</div>
        </div>
        <div class="card__body">기준이나 예시를 카드로 붙입니다.</div>
      </div>

      <div class="card tone-lime">
        <div class="card__head">
          <div class="card__icon"><i class="fa-solid fa-rotate"></i></div>
          <div class="card__title">조건 02</div>
        </div>
        <div class="card__body">색만 바꾸고 싶으면 tone 클래스만 교체.</div>
      </div>

      <div class="note">
        ⚡ 마무리 강조 문장.
      </div>
    </div>

  </div>
</div>
