<h2 class="slide-title">9. MsgBox (확인용 알림창)</h2>

<div class="content-area">
    <div class="two-column">
        <div>
            <h3>디버깅과 소통 도구</h3>
            <p>사용자에게 진행 상황을 알립니다.</p>
            <ul class="checklist-icon">
                <li><i class="fa-solid fa-check"></i> 코드 실행 중간 점검용</li>
                <li><i class="fa-solid fa-check"></i> 오류 위치 파악을 위한 디버깅</li>
                <li><i class="fa-solid fa-check"></i> 간단한 안내 메시지 표시</li>
            </ul>
        </div>
        <div class="code-tile-wrapper">
            <button class="copy-btn" onclick="copyCode(this)">코드 복사</button>
            <div class="code-tile">
<pre>^!m::
    <span class="c-keyword">Run</span>, notepad.exe
    <span class="c-keyword">WinWait</span>, 제목 없음 - 메모장

    <span class="c-comment">; 중간 확인 알림창</span>
    <span class="c-keyword">MsgBox</span>, 메모장이 성공적으로 열렸습니다!

    <span class="c-keyword">Send</span>, 이제 입력을 시작합니다.
<span class="c-keyword">Return</span></pre>
            </div>
        </div>
    </div>
</div>
