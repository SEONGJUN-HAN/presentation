<h2 class="slide-title">4. WinActivate & WinWait (창 제어)</h2>

<div class="content-area">
    <div class="two-column">
        <div>
            <h3>스마트한 창 제어</h3>
            <p>창을 열고(Run) 활성화(WinActivate)하는 과정은 자동화의 기초입니다.</p>
            <ul class="checklist-icon">
                <li>
                    <i class="fa-solid fa-check"></i>
                    컴퓨터 속도에 맞춰 기다려주는 <strong>WinWait</strong>
                </li>
                <li>
                    <i class="fa-solid fa-check"></i>
                    정확한 창 이름을 찾는 <strong>WindowSpy</strong>
                </li>
                <li>
                    <i class="fa-solid fa-check"></i>
                    안정적인 자동화의 핵심 단계
                </li>
            </ul>
        </div>
        <div class="code-tile-wrapper">
            <button class="copy-btn" onclick="copyCode(this)">코드 복사</button>
            <div class="code-tile">
<pre>^!n::
    <span class="c-keyword">Run</span>, notepad.exe
    <span class="c-comment">; 창이 뜰 때까지 대기</span>
    <span class="c-keyword">WinWait</span>, 제목 없음 - 메모장

    <span class="c-comment">; 그 창을 맨 앞으로 활성화</span>
    <span class="c-keyword">WinActivate</span>
<span class="c-keyword">Return</span></pre>
            </div>
        </div>
    </div>
</div>
