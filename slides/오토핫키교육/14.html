<h2 class="slide-title">AutoHotkey란?</h2>

<div class="content-area">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 36px;
                flex-grow: 1; align-items: stretch;">

        <!-- 좌측: 세로 카드 3개 -->
        <div style="display: flex; flex-direction: column; gap: 14px; justify-content: center;">
            <div style="background: var(--bg-secondary); border-radius: 12px;
                        padding: 18px 22px; border: 1px solid var(--border);
                        display: flex; align-items: center; gap: 18px;">
                <span style="font-size: 28px; flex-shrink: 0;">⌨️</span>
                <div>
                    <h3 style="font-size: 18px; margin: 0 0 4px 0;">자동화 스크립트 언어</h3>
                    <p style="font-size: 15px; margin: 0; line-height: 1.5;">
                        키보드, 마우스, 창 제어를 코드 몇 줄로 자동화하는
                        <strong style="color: var(--text-main)">윈도우 전용 무료 도구</strong>입니다.
                    </p>
                </div>
            </div>
            <div style="background: var(--bg-secondary); border-radius: 12px;
                        padding: 18px 22px; border: 1px solid var(--border);
                        display: flex; align-items: center; gap: 18px;">
                <span style="font-size: 28px; flex-shrink: 0;">🧩</span>
                <div>
                    <h3 style="font-size: 18px; margin: 0 0 4px 0;">직관적인 문법</h3>
                    <p style="font-size: 15px; margin: 0; line-height: 1.5;">
                        복잡한 프로그래밍 지식 없이도
                        <strong style="color: var(--text-main)">영어 문장에 가까운 문법</strong>으로
                        빠르게 배울 수 있습니다.
                    </p>
                </div>
            </div>
            <div style="background: var(--bg-secondary); border-radius: 12px;
                        padding: 18px 22px; border: 1px solid var(--border);
                        display: flex; align-items: center; gap: 18px;">
                <span style="font-size: 28px; flex-shrink: 0;">🎮</span>
                <div>
                    <h3 style="font-size: 18px; margin: 0 0 4px 0;">검증된 자동화 도구</h3>
                    <p style="font-size: 15px; margin: 0; line-height: 1.5;">
                        온라인 게임 자동화 도구로 유명해질 만큼
                        <strong style="color: var(--text-main)">반복 동작 자동화</strong>에
                        특화되어 있습니다.
                    </p>
                </div>
            </div>
            <div class="info-box" style="margin: 4px 0 0 0;">
                <p><i class="fa-solid fa-bolt"></i>&nbsp;
                    우리는 이 도구를 <strong style="color: var(--text-main)">업무 자동화</strong>에 활용합니다.
                </p>
            </div>
        </div>

        <!-- 우측: 이미지 -->
        <div class="image-wrapper" style="height: 100%;">
            <img src="img/lineage.png"
                 alt="리니지 게임 화면"
                 onerror="handleImgError(this)">
        </div>

    </div>
</div>
